<svg width="1280" height="700" viewBox="0 0 1280 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">管理端与创作空间治理闭环</title>
  <desc id="desc">展示 admin-web 与 share 创作空间如何把 API Tool Prompt Resource Skill 配置写入数据库，再通过 MCP 运行时生效</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#d8e2ee;stroke-width:1.5}.dark{fill:#172033}.blue{fill:#eff6ff;stroke:#93c5fd}.green{fill:#f0fdf4;stroke:#86efac}.orange{fill:#fff7ed;stroke:#fdba74}.purple{fill:#f5f3ff;stroke:#c4b5fd}.cyan{fill:#ecfeff;stroke:#67e8f9}.title{fill:#172033;font:700 28px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.h{fill:#172033;font:700 17px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.sub{fill:#64748b;font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.white{fill:#fff;font:700 17px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.wsub{fill:#cbd5e1;font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.line{stroke:#94a3b8;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2.1;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker>
  </defs>
  <rect class="bg" width="1280" height="700" rx="24"/>
  <text class="title" x="46" y="58">创作 + 管理 + 运行：企业 AI 能力治理闭环</text>
  <text class="sub" x="46" y="84">后台负责治理用户、角色、Token 和权限；创作空间负责生产 Tool / API / Prompt / Resource / Skill。</text>

  <rect class="dark" x="62" y="166" width="174" height="88" rx="16"/>
  <text class="white" x="106" y="200">管理员</text>
  <text class="wsub" x="90" y="226">admin-web + JWT</text>
  <path class="line" d="M236 210 H310"/>

  <rect class="blue" x="310" y="128" width="252" height="164" rx="18"/>
  <text class="h" x="356" y="164">后台治理</text>
  <text class="sub" x="350" y="196">用户 / 角色 / Token</text>
  <text class="sub" x="350" y="222">工具选择 / Prompt 选择</text>
  <text class="sub" x="350" y="248">审计日志 / 数据源</text>

  <rect class="dark" x="62" y="412" width="174" height="88" rx="16"/>
  <text class="white" x="106" y="446">创作者</text>
  <text class="wsub" x="94" y="472">share/studio</text>
  <path class="line" d="M236 456 H310"/>

  <rect class="green" x="310" y="374" width="252" height="164" rx="18"/>
  <text class="h" x="356" y="410">创作空间</text>
  <text class="sub" x="350" y="442">API 调试后保存</text>
  <text class="sub" x="350" y="468">动态 Tool 调试脚本</text>
  <text class="sub" x="350" y="494">Prompt / Resource / Skill</text>

  <path class="line" d="M562 210 H650"/>
  <path class="line" d="M562 456 H650"/>

  <rect class="orange" x="650" y="168" width="250" height="330" rx="20"/>
  <text class="h" x="706" y="204">MySQL 配置资产</text>
  <rect class="card" x="688" y="232" width="174" height="42" rx="10"/><text class="h" x="716" y="260">mcp_user_token</text>
  <rect class="card" x="688" y="286" width="174" height="42" rx="10"/><text class="h" x="724" y="314">mcp_role_*</text>
  <rect class="card" x="688" y="340" width="174" height="42" rx="10"/><text class="h" x="706" y="368">mcp_request_config</text>
  <rect class="card" x="688" y="394" width="174" height="42" rx="10"/><text class="h" x="712" y="422">mcp_dynamic_tool</text>
  <rect class="card" x="688" y="448" width="174" height="42" rx="10"/><text class="h" x="706" y="476">prompt/resource/skill</text>

  <path class="line" d="M900 333 H986"/>
  <rect class="purple" x="986" y="220" width="224" height="226" rx="18"/>
  <text class="h" x="1032" y="256">MCP 运行时</text>
  <text class="sub" x="1028" y="292">tools/list 实时读取选择</text>
  <text class="sub" x="1028" y="322">tools/call 执行脚本</text>
  <text class="sub" x="1028" y="352">prompts/resources 短路返回</text>
  <text class="sub" x="1028" y="382">所有调用落审计</text>

  <path class="dash" d="M1098 446 V570 H774 V498"/>
  <rect class="cyan" x="624" y="570" width="300" height="56" rx="14"/>
  <text class="h" x="668" y="605">审计反哺后台观测和治理</text>
</svg>
