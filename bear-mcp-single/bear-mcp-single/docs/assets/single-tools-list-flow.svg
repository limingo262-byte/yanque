<svg width="1280" height="690" viewBox="0 0 1280 690" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">tools/list 响应改写流程</title>
  <desc id="desc">Spring AI 先生成内置工具列表，McpToolsListFilter 再根据 Token 选择和角色权限过滤，并追加动态工具</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#d8e2ee;stroke-width:1.5}.dark{fill:#172033}.blue{fill:#eff6ff;stroke:#93c5fd}.green{fill:#f0fdf4;stroke:#86efac}.orange{fill:#fff7ed;stroke:#fdba74}.purple{fill:#f5f3ff;stroke:#c4b5fd}.cyan{fill:#ecfeff;stroke:#67e8f9}.title{fill:#172033;font:700 28px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.h{fill:#172033;font:700 17px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.sub{fill:#64748b;font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.white{fill:#fff;font:700 17px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.wsub{fill:#cbd5e1;font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.line{stroke:#94a3b8;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2.1;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}.tag{fill:#475569;font:13px Arial,"PingFang SC","Microsoft YaHei",sans-serif}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker>
  </defs>
  <rect class="bg" width="1280" height="690" rx="24"/>
  <text class="title" x="46" y="58">tools/list：先借 Spring AI 生成内置工具，再按当前 Token 重写结果</text>
  <text class="sub" x="46" y="84">这个链路解决两个问题：不同 Token 看到不同工具；数据库动态工具也能出现在 MCP 工具列表里。</text>

  <rect class="dark" x="62" y="162" width="166" height="78" rx="15"/>
  <text class="white" x="98" y="194">tools/list</text>
  <text class="wsub" x="100" y="218">JSON-RPC</text>
  <path class="line" d="M228 201 H290"/>

  <rect class="blue" x="290" y="132" width="222" height="138" rx="16"/>
  <text class="h" x="328" y="168">CachedRequest</text>
  <text class="sub" x="328" y="198">读取 method</text>
  <text class="sub" x="328" y="223">请求体可重复读</text>
  <path class="line" d="M512 201 H574"/>

  <rect class="green" x="574" y="132" width="222" height="138" rx="16"/>
  <text class="h" x="614" y="168">Spring AI</text>
  <text class="sub" x="614" y="198">先生成所有内置 @Tool</text>
  <text class="sub" x="614" y="223">ContentCachingResponse</text>
  <path class="line" d="M796 201 H858"/>

  <rect class="orange" x="858" y="132" width="242" height="138" rx="16"/>
  <text class="h" x="900" y="168">DynamicToolService</text>
  <text class="sub" x="900" y="198">getUserFinalTools</text>
  <text class="sub" x="900" y="223">selected ∩ allowed</text>
  <path class="line" d="M1100 201 H1160"/>

  <rect class="purple" x="1086" y="336" width="150" height="86" rx="16"/>
  <text class="h" x="1124" y="370">返回</text>
  <text class="sub" x="1112" y="397">改写后的 tools</text>

  <path class="line" d="M979 270 V330 H720"/>
  <rect class="card" x="584" y="330" width="272" height="192" rx="18"/>
  <text class="h" x="628" y="364">改写 result.tools</text>
  <rect class="blue" x="620" y="388" width="200" height="44" rx="10"/><text class="h" x="658" y="417">过滤内置工具</text>
  <rect class="green" x="620" y="452" width="200" height="44" rx="10"/><text class="h" x="652" y="481">追加动态工具</text>
  <path class="line" d="M856 426 H1086 V379"/>

  <rect class="cyan" x="274" y="350" width="240" height="148" rx="16"/>
  <text class="h" x="320" y="384">数据库参与计算</text>
  <text class="sub" x="318" y="414">mcp_user_tool_selection</text>
  <text class="sub" x="318" y="439">mcp_dynamic_tool</text>
  <text class="sub" x="318" y="464">role tool 权限在上下文里</text>
  <path class="dash" d="M514 424 H584"/>

  <rect class="card" x="62" y="558" width="1174" height="64" rx="16"/>
  <text class="h" x="98" y="595">关键点：</text>
  <text class="sub" x="182" y="595">内置工具的完整 schema 仍由 Spring AI 生成；动态工具的 name、description、inputSchema 来自数据库。</text>
</svg>
