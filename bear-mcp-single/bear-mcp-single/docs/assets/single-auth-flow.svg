<svg width="1280" height="650" viewBox="0 0 1280 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ApiKeyAuthFilter 鉴权流程</title>
  <desc id="desc">展示 MCP 请求如何通过 Bearer Token、SHA-256 摘要、用户角色和权限聚合构建 McpUserContext</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#d8e2ee;stroke-width:1.5}.dark{fill:#172033}.blue{fill:#eff6ff;stroke:#93c5fd}.green{fill:#f0fdf4;stroke:#86efac}.orange{fill:#fff7ed;stroke:#fdba74}.red{fill:#fef2f2;stroke:#fca5a5}.purple{fill:#f5f3ff;stroke:#c4b5fd}.title{fill:#172033;font:700 28px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.h{fill:#172033;font:700 17px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.sub{fill:#64748b;font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.white{fill:#fff;font:700 17px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.wsub{fill:#cbd5e1;font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.line{stroke:#94a3b8;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2.1;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}.tag{fill:#475569;font:13px Arial,"PingFang SC","Microsoft YaHei",sans-serif}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker>
  </defs>
  <rect class="bg" width="1280" height="650" rx="24"/>
  <text class="title" x="46" y="58">ApiKeyAuthFilter：先确认是谁，再让请求进入 Spring AI</text>
  <text class="sub" x="46" y="84">MCP Token 链路只保护 /mcp；管理后台和 share 有自己的登录态/JWT 链路。</text>

  <rect class="dark" x="64" y="166" width="170" height="88" rx="16"/>
  <text class="white" x="98" y="199">POST /mcp</text>
  <text class="wsub" x="92" y="226">Bearer mcp_xxx</text>
  <path class="line" d="M234 210 H294"/>

  <rect class="blue" x="294" y="146" width="190" height="128" rx="16"/>
  <text class="h" x="330" y="181">提取 Token</text>
  <text class="sub" x="326" y="211">Authorization</text>
  <text class="sub" x="326" y="236">或 mcp_token 参数</text>
  <path class="line" d="M484 210 H544"/>

  <rect class="green" x="544" y="146" width="196" height="128" rx="16"/>
  <text class="h" x="584" y="181">TokenService</text>
  <text class="sub" x="584" y="211">SHA-256 摘要</text>
  <text class="sub" x="584" y="236">查 mcp_user_token</text>
  <path class="line" d="M740 210 H800"/>

  <rect class="orange" x="800" y="146" width="196" height="128" rx="16"/>
  <text class="h" x="838" y="181">聚合权限</text>
  <text class="sub" x="838" y="211">用户启用 + 角色启用</text>
  <text class="sub" x="838" y="236">tool/prompt/resource</text>
  <path class="line" d="M996 210 H1056"/>

  <rect class="purple" x="1056" y="146" width="170" height="128" rx="16"/>
  <text class="h" x="1084" y="181">上下文</text>
  <text class="sub" x="1088" y="211">McpUserContext</text>
  <text class="sub" x="1088" y="236">ThreadLocal</text>

  <path class="dash" d="M642 274 V360 H230"/>
  <rect class="red" x="64" y="344" width="332" height="86" rx="16"/>
  <text class="h" x="104" y="378">无效 Token：直接返回 401</text>
  <text class="sub" x="104" y="405">Spring AI MCP Handler 看不到这个请求</text>

  <path class="line" d="M1141 274 V348"/>
  <rect class="card" x="966" y="348" width="260" height="96" rx="16"/>
  <text class="h" x="1004" y="384">后续 Filter 直接读取</text>
  <text class="sub" x="1004" y="413">userId / tokenId / allowedTools</text>

  <rect class="card" x="294" y="486" width="702" height="76" rx="16"/>
  <text class="h" x="334" y="518">finally 清理 ThreadLocal</text>
  <text class="sub" x="334" y="545">Tomcat 工作线程会复用，请求结束必须 clear，避免身份串到下一个请求。</text>
</svg>
