<svg width="1280" height="660" viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">企业 MCP Server 项目优势</title>
  <desc id="desc">项目通过 MCP 中台、动态工具、Skill 沉淀和 Codex 等现成 Agent 能力，降低重复开发，让运营可以直接通过 Agent 使用企业能力</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#d8e2ee;stroke-width:1.6}.dark{fill:#172033}.red{fill:#fff1f2;stroke:#fda4af}.green{fill:#f0fdf4;stroke:#86efac}.blue{fill:#eff6ff;stroke:#93c5fd}.cyan{fill:#ecfeff;stroke:#67e8f9}.purple{fill:#f5f3ff;stroke:#c4b5fd}.orange{fill:#fff7ed;stroke:#fdba74}.gray{fill:#f1f5f9;stroke:#cbd5e1}.title{fill:#172033;font:700 28px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.h{fill:#172033;font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.sub{fill:#64748b;font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.tiny{fill:#64748b;font:12px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.white{fill:#fff;font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.wsub{fill:#cbd5e1;font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.line{stroke:#94a3b8;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2.1;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker>
  </defs>

  <rect class="bg" width="1280" height="660" rx="24"/>
  <text class="title" x="52" y="62">项目优势：把重复工作沉淀成可复用的企业 AI 能力</text>
  <text class="sub" x="52" y="88">以前是人找人、开发写接口、Agent 重复接入；现在是 MCP 中台沉淀工具和 Skill，业务人员直接通过 Agent 使用。</text>

  <rect class="panel" x="54" y="126" width="354" height="390" rx="24"/>
  <text class="h" x="94" y="166">以前：问题依赖开发处理</text>
  <rect class="red" x="92" y="206" width="278" height="54" rx="14"/>
  <text class="tiny" x="120" y="238">运营发现问题，找开发查数据</text>
  <rect class="red" x="92" y="282" width="278" height="54" rx="14"/>
  <text class="tiny" x="118" y="314">开发重复写 SQL / 调接口</text>
  <rect class="red" x="92" y="358" width="278" height="54" rx="14"/>
  <text class="tiny" x="118" y="390">相似问题反复沟通和排查</text>
  <rect class="red" x="92" y="434" width="278" height="54" rx="14"/>
  <text class="tiny" x="118" y="466">经验散落在人和临时代码里</text>

  <path class="line" d="M408 321 H474"/>
  <rect class="panel" x="474" y="126" width="354" height="390" rx="24"/>
  <text class="h" x="514" y="166">现在：MCP 中台统一沉淀</text>
  <rect class="blue" x="512" y="204" width="278" height="48" rx="14"/>
  <text class="tiny" x="550" y="233">动态 Tool：封装 API / SQL</text>
  <rect class="green" x="512" y="270" width="278" height="48" rx="14"/>
  <text class="tiny" x="548" y="299">Groovy：编排多个步骤</text>
  <rect class="cyan" x="512" y="336" width="278" height="48" rx="14"/>
  <text class="tiny" x="546" y="365">Prompt / Resource：沉淀口径和文档</text>
  <rect class="purple" x="512" y="402" width="278" height="48" rx="14"/>
  <text class="tiny" x="548" y="431">Skill：沉淀可复用流程</text>

  <path class="line" d="M828 321 H894"/>
  <rect class="panel" x="894" y="126" width="332" height="390" rx="24"/>
  <text class="h" x="934" y="166">结果：业务直接使用 Agent</text>
  <rect class="dark" x="934" y="206" width="252" height="64" rx="16"/>
  <text class="white" x="984" y="232">Codex / Cursor</text>
  <text class="wsub" x="976" y="252">现成 Agent 能力</text>
  <rect class="orange" x="934" y="304" width="252" height="54" rx="14"/>
  <text class="tiny" x="972" y="336">运营直接提问查问题</text>
  <rect class="green" x="934" y="380" width="252" height="54" rx="14"/>
  <text class="tiny" x="966" y="412">开发从重复查询中释放</text>
  <rect class="blue" x="934" y="456" width="252" height="54" rx="14"/>
  <text class="tiny" x="966" y="488">能力可治理、可审计、可复用</text>

  <rect class="panel" x="54" y="548" width="1172" height="54" rx="16"/>
  <text class="h" x="90" y="581">一句话：</text>
  <text class="sub" x="178" y="581">项目最大的优势是灵活：复用现成 Agent，沉淀企业工具和流程，让重复问题从“找开发”变成“问 Agent”。</text>
</svg>
