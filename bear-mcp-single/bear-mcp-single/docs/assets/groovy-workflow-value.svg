<svg width="1280" height="660" viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Groovy 让动态工具具备编排能力</title>
  <desc id="desc">没有 Groovy 时工具更像单 API 映射，有 Groovy 后一个工具可以编排多个 API 和数据源，形成面向业务目标的 workflow</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#d8e2ee;stroke-width:1.6}.left{fill:#fff7ed;stroke:#fdba74}.right{fill:#f0fdf4;stroke:#86efac}.blue{fill:#eff6ff;stroke:#93c5fd}.cyan{fill:#ecfeff;stroke:#67e8f9}.purple{fill:#f5f3ff;stroke:#c4b5fd}.gray{fill:#f1f5f9;stroke:#cbd5e1}.dark{fill:#172033}.title{fill:#172033;font:700 28px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.h{fill:#172033;font:700 19px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.sub{fill:#64748b;font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.tiny{fill:#64748b;font:12px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.white{fill:#fff;font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.line{stroke:#94a3b8;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}.bad{stroke:#fb923c;stroke-width:2.2;fill:none;marker-end:url(#orangeArrow)}.good{stroke:#22c55e;stroke-width:2.2;fill:none;marker-end:url(#greenArrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#fb923c"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22c55e"/></marker>
  </defs>

  <rect class="bg" width="1280" height="660" rx="24"/>
  <text class="title" x="52" y="62">为什么动态工具要有 Groovy 编排层</text>
  <text class="sub" x="52" y="88">它让 MCP Tool 不只是“一个工具调用一个接口”，而是可以承载完整业务动作和小型 workflow。</text>

  <rect class="panel" x="52" y="126" width="560" height="438" rx="24"/>
  <text class="h" x="92" y="166">没有 Groovy：工具更像 API 映射</text>
  <text class="sub" x="92" y="192">一个 MCP Tool 通常只能直接转发到一个固定接口。</text>

  <rect class="left" x="90" y="236" width="170" height="66" rx="14"/>
  <text class="h" x="122" y="262">Tool A</text>
  <text class="tiny" x="112" y="282">查订单接口</text>
  <path class="bad" d="M260 269 H350"/>
  <rect class="gray" x="350" y="236" width="190" height="66" rx="14"/>
  <text class="h" x="402" y="262">API 1</text>
  <text class="tiny" x="386" y="282">GET /order/detail</text>

  <rect class="left" x="90" y="326" width="170" height="66" rx="14"/>
  <text class="h" x="122" y="352">Tool B</text>
  <text class="tiny" x="112" y="372">查支付接口</text>
  <path class="bad" d="M260 359 H350"/>
  <rect class="gray" x="350" y="326" width="190" height="66" rx="14"/>
  <text class="h" x="402" y="352">API 2</text>
  <text class="tiny" x="386" y="372">GET /pay/status</text>

  <rect class="left" x="90" y="416" width="170" height="66" rx="14"/>
  <text class="h" x="122" y="442">Tool C</text>
  <text class="tiny" x="106" y="462">查物流接口</text>
  <path class="bad" d="M260 449 H350"/>
  <rect class="gray" x="350" y="416" width="190" height="66" rx="14"/>
  <text class="h" x="402" y="442">API 3</text>
  <text class="tiny" x="386" y="462">GET /ship/track</text>

  <rect class="left" x="90" y="500" width="450" height="36" rx="10"/>
  <text class="sub" x="112" y="523">问题：工具粒度碎、难组合、结果需要模型自己拼。</text>

  <rect class="panel" x="668" y="126" width="560" height="438" rx="24"/>
  <text class="h" x="708" y="166">有 Groovy：工具变成业务 workflow</text>
  <text class="sub" x="708" y="192">一个 MCP Tool 可以编排多个 API / SQL，并统一整理结果。</text>

  <rect class="right" x="706" y="272" width="172" height="86" rx="16"/>
  <text class="h" x="742" y="302">业务 Tool</text>
  <text class="tiny" x="730" y="324">查询订单全貌</text>
  <text class="tiny" x="730" y="342">面向业务目标</text>

  <path class="good" d="M878 315 H946"/>
  <rect class="purple" x="946" y="210" width="220" height="46" rx="12"/>
  <text class="tiny" x="982" y="238">1. 参数校验 / 默认值处理</text>
  <path class="dash" d="M1056 256 V282"/>
  <rect class="blue" x="946" y="282" width="220" height="46" rx="12"/>
  <text class="tiny" x="990" y="310">2. 调订单 API</text>
  <path class="dash" d="M1056 328 V354"/>
  <rect class="green" x="946" y="354" width="220" height="46" rx="12"/>
  <text class="tiny" x="990" y="382">3. 调支付 API</text>
  <path class="dash" d="M1056 400 V426"/>
  <rect class="cyan" x="946" y="426" width="220" height="46" rx="12"/>
  <text class="tiny" x="990" y="454">4. 查询补充 SQL</text>

  <path class="good" d="M946 500 C888 500 858 430 804 360"/>
  <rect class="right" x="706" y="438" width="172" height="70" rx="16"/>
  <text class="h" x="742" y="466">统一返回</text>
  <text class="tiny" x="730" y="488">聚合 / 过滤 / 格式化</text>

  <rect class="right" x="706" y="500" width="460" height="36" rx="10"/>
  <text class="sub" x="728" y="523">价值：工具更少但能力更强，模型只需选择一个业务动作。</text>

  <rect class="dark" x="52" y="590" width="1176" height="46" rx="14"/>
  <text class="white" x="88" y="619">一句话：</text>
  <text class="wsub" x="176" y="619" fill="#cbd5e1" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14">没有 Groovy，Tool 容易退化成 API 清单；有了 Groovy，Tool 可以封装业务流程，让 Agent 调一个工具完成一件完整的事。</text>
</svg>
