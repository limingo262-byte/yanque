<svg width="1280" height="660" viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Agent 调用 MCP 的基本顺序</title>
  <desc id="desc">MCP Client 先 initialize，再 tools list，模型选择工具后发起 tools call，最后返回结果</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#d8e2ee;stroke-width:1.6}.laneHead{fill:#172033}.blue{fill:#eff6ff;stroke:#93c5fd}.green{fill:#f0fdf4;stroke:#86efac}.orange{fill:#fff7ed;stroke:#fdba74}.cyan{fill:#ecfeff;stroke:#67e8f9}.purple{fill:#f5f3ff;stroke:#c4b5fd}.soft{fill:#f1f5f9;stroke:#cbd5e1}.title{fill:#172033;font:700 28px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.h{fill:#172033;font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.sub{fill:#64748b;font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.tiny{fill:#64748b;font:12px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.white{fill:#fff;font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.wsub{fill:#cbd5e1;font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.line{stroke:#94a3b8;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.return{stroke:#94a3b8;stroke-width:2.4;fill:none;marker-end:url(#arrow);stroke-dasharray:7 6}.thin{stroke:#cbd5e1;stroke-width:1.4;fill:none}.num{fill:#fff;font:700 14px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.code{fill:#172033;font:700 15px Arial,"PingFang SC","Microsoft YaHei",sans-serif}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker>
  </defs>

  <rect class="bg" width="1280" height="660" rx="24"/>
  <text class="title" x="54" y="62">一般 Agent 调用 MCP 的顺序</text>
  <text class="sub" x="54" y="88">先握手确认服务端能力，再发现当前会话可用能力，模型选择后才真正发起工具调用。</text>

  <rect class="panel" x="54" y="128" width="1172" height="430" rx="24"/>

  <rect class="laneHead" x="88" y="158" width="250" height="76" rx="16"/>
  <text class="white" x="156" y="190">MCP Client</text>
  <text class="wsub" x="134" y="215">Cursor / Codex / Claude</text>

  <rect class="laneHead" x="515" y="158" width="250" height="76" rx="16"/>
  <text class="white" x="572" y="190">MCP Server</text>
  <text class="wsub" x="548" y="215">协议网关 + 企业能力</text>

  <rect class="laneHead" x="942" y="158" width="250" height="76" rx="16"/>
  <text class="white" x="1014" y="190">大模型</text>
  <text class="wsub" x="994" y="215">理解问题并选择工具</text>

  <path class="thin" d="M213 246 V520"/>
  <path class="thin" d="M640 246 V520"/>
  <path class="thin" d="M1067 246 V520"/>

  <circle cx="384" cy="282" r="17" fill="#172033"/><text class="num" x="379" y="287">1</text>
  <path class="line" d="M235 282 H492"/>
  <rect class="blue" x="515" y="255" width="250" height="54" rx="14"/>
  <text class="code" x="598" y="278">initialize</text>
  <text class="tiny" x="558" y="298">握手，返回 capabilities</text>

  <circle cx="384" cy="354" r="17" fill="#172033"/><text class="num" x="379" y="359">2</text>
  <path class="line" d="M235 354 H492"/>
  <rect class="green" x="515" y="327" width="250" height="54" rx="14"/>
  <text class="code" x="594" y="350">tools/list</text>
  <text class="tiny" x="550" y="370">返回当前 Token 可用工具</text>

  <circle cx="814" cy="354" r="17" fill="#172033"/><text class="num" x="809" y="359">3</text>
  <path class="line" d="M765 354 H918"/>
  <rect class="purple" x="942" y="312" width="250" height="84" rx="14"/>
  <text class="h" x="1016" y="342">模型决策</text>
  <text class="tiny" x="982" y="365">读取 tool 描述和 schema</text>
  <text class="tiny" x="990" y="383">生成 name + arguments</text>

  <circle cx="814" cy="438" r="17" fill="#172033"/><text class="num" x="809" y="443">4</text>
  <path class="line" d="M918 438 H765"/>
  <rect class="orange" x="515" y="411" width="250" height="54" rx="14"/>
  <text class="code" x="594" y="434">tools/call</text>
  <text class="tiny" x="548" y="454">按工具名和参数执行</text>

  <circle cx="384" cy="506" r="17" fill="#172033"/><text class="num" x="379" y="511">5</text>
  <path class="return" d="M515 506 H235"/>
  <rect class="cyan" x="515" y="479" width="250" height="54" rx="14"/>
  <text class="code" x="604" y="502">result</text>
  <text class="tiny" x="554" y="522">返回 JSON-RPC 结果</text>

  <rect class="soft" x="804" y="255" width="116" height="54" rx="12"/>
  <text class="tiny" x="825" y="278">prompts/list</text>
  <text class="tiny" x="825" y="296">resources/list</text>
  <path class="return" d="M804 282 H765"/>
  <text class="tiny" x="806" y="246">可选发现</text>

  <rect class="panel" x="54" y="586" width="1172" height="50" rx="16"/>
  <text class="h" x="88" y="617">读图重点：</text>
  <text class="sub" x="190" y="617">`initialize` 解决“支持什么”，`list` 解决“当前能用什么”，`call / get / read` 才是真正执行或读取。</text>
</svg>
