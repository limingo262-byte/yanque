<svg width="1280" height="560" viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MCP 与工具化能力</title>
  <desc id="desc">说明 MCP 如何把企业接口、数据库和文档包装成大模型可发现、可理解、可调用的工具资产</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#d8e2ee;stroke-width:1.5}.dark{fill:#172033}.blue{fill:#eff6ff;stroke:#93c5fd}.green{fill:#f0fdf4;stroke:#86efac}.orange{fill:#fff7ed;stroke:#fdba74}.purple{fill:#f5f3ff;stroke:#c4b5fd}.cyan{fill:#ecfeff;stroke:#67e8f9}.title{fill:#172033;font:700 28px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.h{fill:#172033;font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.sub{fill:#64748b;font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.white{fill:#fff;font:700 18px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.wsub{fill:#cbd5e1;font:14px Arial,"PingFang SC","Microsoft YaHei",sans-serif}.line{stroke:#94a3b8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.tag{fill:#475569;font:13px Arial,"PingFang SC","Microsoft YaHei",sans-serif}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker>
  </defs>
  <rect class="bg" width="1280" height="560" rx="24"/>
  <text class="title" x="46" y="58">MCP：把企业能力变成 AI 能理解和调用的工具</text>
  <text class="sub" x="46" y="84">大模型本身不会直接访问内部系统，MCP 提供标准方式把业务能力暴露给 Agent。</text>

  <rect class="dark" x="70" y="210" width="190" height="96" rx="18"/>
  <text class="white" x="116" y="246">AI Agent</text>
  <text class="wsub" x="104" y="274">Codex / Cursor</text>
  <path class="line" d="M260 258 H348"/>

  <rect class="card" x="348" y="142" width="300" height="232" rx="20"/>
  <text class="h" x="430" y="178">MCP Tool</text>
  <text class="sub" x="390" y="212">不是简单 HTTP 转发</text>
  <rect class="blue" x="388" y="238" width="220" height="42" rx="10"/><text class="h" x="440" y="266">name</text>
  <rect class="green" x="388" y="292" width="220" height="42" rx="10"/><text class="h" x="426" y="320">description</text>
  <rect class="orange" x="388" y="346" width="220" height="42" rx="10"/><text class="h" x="430" y="374">inputSchema</text>

  <path class="line" d="M648 258 H736"/>
  <text class="tag" x="664" y="240">标准协议</text>

  <rect class="card" x="736" y="126" width="454" height="264" rx="20"/>
  <text class="h" x="902" y="164">企业能力</text>
  <rect class="blue" x="780" y="202" width="160" height="58" rx="12"/><text class="h" x="820" y="238">业务接口</text>
  <rect class="green" x="986" y="202" width="160" height="58" rx="12"/><text class="h" x="1028" y="238">数据库</text>
  <rect class="purple" x="780" y="296" width="160" height="58" rx="12"/><text class="h" x="826" y="332">文档</text>
  <rect class="cyan" x="986" y="296" width="160" height="58" rx="12"/><text class="h" x="1024" y="332">Prompt</text>

  <rect class="card" x="112" y="430" width="1036" height="54" rx="14"/>
  <text class="h" x="154" y="464">一句话：</text>
  <text class="sub" x="250" y="464">MCP 把接口背后的业务语义、参数结构和调用边界告诉大模型，让它更容易选对工具、传对参数。</text>
</svg>
